{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h2>{{ 'Editar' if usuario else 'Novo' }} Usuário</h2>
    <a href="{{ url_for('admin.lista_usuarios') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Voltar
    </a>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nome Completo</label>
                    <input type="text" name="nome" class="form-control" required
                           value="{{ usuario.nome if usuario else '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Nome de Usuário</label>
                    <input type="text" name="usuario" class="form-control" required
                           value="{{ usuario.usuario if usuario else '' }}"
                           {{ 'readonly' if usuario else '' }}>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Senha {{ '(deixe em branco para manter)' if usuario else '' }}</label>
                    <input type="password" name="senha" class="form-control"
                           {{ 'required' if not usuario else '' }}>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Cargo</label>
                    <select name="cargo" class="form-select">
                        <option value="Usuário" {% if usuario and usuario.cargo == 'Usuário' %}selected{% endif %}>Usuário</option>
                        <option value="Supervisor" {% if usuario and usuario.cargo == 'Supervisor' %}selected{% endif %}>Supervisor</option>
                        <option value="Admin" {% if usuario and usuario.cargo == 'Admin' %}selected{% endif %}>Admin</option>
                    </select>
                </div>
            </div>
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg"></i> Salvar
                </button>
                <a href="{{ url_for('admin.lista_usuarios') }}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
