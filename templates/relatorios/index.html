{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h2>Relatórios</h2>
</div>

<div class="row g-3 mb-3">
    <div class="col-12">
        <div class="card">
            <div class="card-body py-2">
                <div class="row g-2 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label small mb-1">Buscar por nome</label>
                        <input type="text" id="nome" class="form-control form-control-sm"
                               placeholder="Nome do óbito..." autocomplete="off">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small mb-1">Data Início</label>
                        <input type="date" id="data_inicio" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small mb-1">Data Fim</label>
                        <input type="date" id="data_fim" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-1">
                        <label class="form-label small mb-1">Idade mín</label>
                        <input type="number" id="idade_min" class="form-control form-control-sm"
                               min="0" max="150" placeholder="0">
                    </div>
                    <div class="col-md-1">
                        <label class="form-label small mb-1">Idade máx</label>
                        <input type="number" id="idade_max" class="form-control form-control-sm"
                               min="0" max="150" placeholder="150">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small mb-1">&nbsp;</label>
                        <div class="d-flex gap-1 flex-wrap">
                            <button class="btn btn-sm btn-outline-secondary" onclick="setPeriodo('mes')">Este mês</button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="setPeriodo('trimestre')">Trimestre</button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="setPeriodo('semestre')">Semestre</button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="setPeriodo('ano')">Este ano</button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="setPeriodo('tudo')">Todos</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row g-3 mb-3">
    <div class="col-12">
        <div class="card">
            <div class="card-body py-2">
                <div class="d-flex gap-2 flex-wrap align-items-center">
                    <button class="btn btn-outline-primary btn-sm active" onclick="carregarDados('geral')" id="btn-geral">
                        <i class="bi bi-table"></i> Visao Geral
                    </button>
                    <button class="btn btn-outline-primary btn-sm" onclick="carregarDados('investigacoes')" id="btn-investigacoes">
                        <i class="bi bi-search"></i> Investigacoes
                    </button>
                    <button class="btn btn-outline-primary btn-sm" onclick="carregarDados('causas')" id="btn-causas">
                        <i class="bi bi-heart-pulse"></i> Causas
                    </button>
                    <span class="vr"></span>
                    <button class="btn btn-outline-success btn-sm" onclick="exportar('csv')" id="btn-csv">
                        <i class="bi bi-filetype-csv"></i> CSV
                    </button>
                    <button class="btn btn-outline-danger btn-sm" onclick="exportar('pdf')" id="btn-pdf">
                        <i class="bi bi-file-earmark-pdf"></i> PDF
                    </button>
                    <span class="vr"></span>
                    <small class="text-muted" id="filtro-status"></small>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="row g-3">
    <div class="col-md-7">
        <div class="card">
            <div class="card-header">Gráfico</div>
            <div class="card-body">
                <canvas id="graficoPrincipal" height="250"></canvas>
                <p class="text-muted text-center small mt-2" id="grafico-label">Selecione um tipo de relatório</p>
            </div>
        </div>
    </div>
    <div class="col-md-5">
        <div class="card">
            <div class="card-header">Resumo</div>
            <div class="card-body" id="resumo-dados">
                <p class="text-muted text-center py-4">Clique em um tipo de relatório para visualizar os dados.</p>
            </div>
        </div>
    </div>
</div>

<script>
let graficoAtual = null;
let tipoAtual = 'geral';

function setPeriodo(periodo) {
    const hoje = new Date();
    const yyyy = hoje.getFullYear();
    const mm = String(hoje.getMonth() + 1).padStart(2, '0');
    const dd = String(hoje.getDate()).padStart(2, '0');
    const hojeStr = `${yyyy}-${mm}-${dd}`;

    let inicio = '';
    switch (periodo) {
        case 'mes':
            inicio = `${yyyy}-${mm}-01`;
            break;
        case 'trimestre':
            const mesTri = hoje.getMonth() - 2;
            const anoTri = mesTri < 0 ? yyyy - 1 : yyyy;
            const mesReal = mesTri < 0 ? mesTri + 12 : mesTri;
            inicio = `${anoTri}-${String(mesReal + 1).padStart(2, '0')}-01`;
            break;
        case 'semestre':
            const mesSem = hoje.getMonth() - 5;
            const anoSem = mesSem < 0 ? yyyy - 1 : yyyy;
            const mesRealSem = mesSem < 0 ? mesSem + 12 : mesSem;
            inicio = `${anoSem}-${String(mesRealSem + 1).padStart(2, '0')}-01`;
            break;
        case 'ano':
            inicio = `${yyyy}-01-01`;
            break;
        case 'tudo':
            inicio = '';
            break;
    }
    document.getElementById('data_inicio').value = inicio;
    document.getElementById('data_fim').value = (periodo === 'tudo') ? '' : hojeStr;
    document.getElementById('nome').value = '';
    document.getElementById('idade_min').value = '';
    document.getElementById('idade_max').value = '';
    carregarDados(tipoAtual);
}

function getFiltrosParams() {
    const data_inicio = document.getElementById('data_inicio').value;
    const data_fim = document.getElementById('data_fim').value;
    const nome = document.getElementById('nome').value;
    const idade_min = document.getElementById('idade_min').value;
    const idade_max = document.getElementById('idade_max').value;

    let params = `tipo=${tipoAtual}`;
    if (data_inicio) params += `&data_inicio=${data_inicio}`;
    if (data_fim) params += `&data_fim=${data_fim}`;
    if (nome) params += `&nome=${encodeURIComponent(nome)}`;
    if (idade_min) params += `&idade_min=${idade_min}`;
    if (idade_max) params += `&idade_max=${idade_max}`;
    return params;
}

function atualizarFiltroStatus() {
    const nome = document.getElementById('nome').value;
    const di = document.getElementById('data_inicio').value;
    const df = document.getElementById('data_fim').value;
    const imin = document.getElementById('idade_min').value;
    const imax = document.getElementById('idade_max').value;

    const partes = [];
    if (nome) partes.push(`Nome: "${nome}"`);
    if (di || df) partes.push(`Período: ${di || '...'} a ${df || '...'}`);
    if (imin || imax) partes.push(`Idade: ${imin || '0'} a ${imax || '...'}`);

    document.getElementById('filtro-status').textContent = partes.length ? 'Filtros: ' + partes.join(' | ') : '';
}

function exportar(formato) {
    const url = `/relatorios/exportar/${formato}?${getFiltrosParams()}`;
    window.location.href = url;
}

function carregarDados(tipo) {
    tipoAtual = tipo;
    document.querySelectorAll('[id^="btn-"]').forEach(b => b.classList.remove('active'));
    document.getElementById('btn-' + tipo).classList.add('active');

    atualizarFiltroStatus();

    fetch(`/relatorios/dados?${getFiltrosParams()}`)
        .then(r => r.json())
        .then(dados => {
            const resumo = document.getElementById('resumo-dados');
            const lbl = document.getElementById('grafico-label');

            if (tipo === 'geral') {
                lbl.textContent = 'Óbitos por Categoria';
                let html = `<h3 class="text-center mb-3">Total: ${dados.total}</h3>`;
                html += '<h6>Por Sexo</h6><table class="table table-sm">';
                dados.por_sexo.forEach(item => {
                    html += `<tr><td>${item.label}</td><td class="text-end"><strong>${item.value}</strong></td></tr>`;
                });
                html += '</table><h6>Por Local</h6><table class="table table-sm">';
                dados.por_local.forEach(item => {
                    html += `<tr><td>${item.label}</td><td class="text-end"><strong>${item.value}</strong></td></tr>`;
                });
                html += '</table>';
                resumo.innerHTML = html;
                renderGrafico(dados.por_sexo);
            } else if (tipo === 'investigacoes') {
                lbl.textContent = 'Investigações por Tipo';
                let html = `<h3 class="text-center mb-3">Total: ${dados.total}</h3>`;
                html += '<h6>Por Tipo</h6><table class="table table-sm">';
                dados.por_tipo.forEach(item => {
                    html += `<tr><td>${item.label}</td><td class="text-end"><strong>${item.value}</strong></td></tr>`;
                });
                html += '</table><h6>Por Status</h6><table class="table table-sm">';
                dados.por_status.forEach(item => {
                    html += `<tr><td>${item.label}</td><td class="text-end"><strong>${item.value}</strong></td></tr>`;
                });
                html += '</table>';
                resumo.innerHTML = html;
                renderGrafico(dados.por_tipo);
            } else if (tipo === 'causas') {
                lbl.textContent = 'Principais Causas (CID)';
                let html = '<h6>Principais CID</h6><table class="table table-sm">';
                dados.causas.forEach(item => {
                    html += `<tr><td><strong>${item.label}</strong><br><small class="text-muted">${item.descricao || ''}</small></td><td class="text-end"><strong>${item.value}</strong></td></tr>`;
                });
                html += '</table>';
                resumo.innerHTML = html;
                renderGrafico(dados.causas);
            }
        });
}

function renderGrafico(dados) {
    if (graficoAtual) graficoAtual.destroy();
    const ctx = document.getElementById('graficoPrincipal').getContext('2d');
    const cores = ['#1a5276', '#2e86c1', '#27ae60', '#f39c12', '#e74c3c', '#8e44ad', '#16a085'];
    graficoAtual = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: dados.map(d => d.label),
            datasets: [{
                data: dados.map(d => d.value),
                backgroundColor: dados.map((_, i) => cores[i % cores.length]),
                borderRadius: 4,
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false },
            },
            scales: {
                y: { beginAtZero: true, ticks: { stepSize: 1 } }
            }
        }
    });
}

document.querySelectorAll('#nome, #data_inicio, #data_fim, #idade_min, #idade_max').forEach(el => {
    let timeout;
    el.addEventListener('input', () => {
        clearTimeout(timeout);
        timeout = setTimeout(() => carregarDados(tipoAtual), 400);
    });
});

carregarDados('geral');
</script>
{% endblock %}
