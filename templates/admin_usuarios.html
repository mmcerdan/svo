{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h2>Usuários</h2>
    <a href="{{ url_for('admin.novo_usuario') }}" class="btn btn-primary">
        <i class="bi bi-plus-lg"></i> Novo Usuário
    </a>
</div>

<div class="card">
    <div class="card-body p-0">
        <table class="table table-hover mb-0">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Usuário</th>
                    <th>Cargo</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                {% for u in usuarios %}
                <tr>
                    <td><strong>{{ u.nome }}</strong></td>
                    <td>{{ u.usuario }}</td>
                    <td><span class="badge bg-{{ 'danger' if u.cargo == 'Admin' else 'primary' if u.cargo == 'Supervisor' else 'secondary' }}">{{ u.cargo }}</span></td>
                    <td>
                        {% if u.ativo %}
                        <span class="badge bg-success">Ativo</span>
                        {% else %}
                        <span class="badge bg-secondary">Inativo</span>
                        {% endif %}
                    </td>
                    <td>
                        <a href="{{ url_for('admin.editar_usuario', id=u.id) }}" class="btn btn-warning btn-sm">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form method="POST" action="{{ url_for('admin.ativar_usuario', id=u.id) }}" style="display:inline">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <button type="submit" class="btn btn-{{ 'secondary' if u.ativo else 'success' }} btn-sm">
                                <i class="bi bi-{{ 'pause' if u.ativo else 'play' }}"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
