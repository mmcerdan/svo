{# Recomendações - Textareas #}
<div class="campo-grupo recomendacoes">
    <div class="grupo-titulo">{{ grupo.titulo }}</div>
    {% for campo in grupo.campos %}
    <div class="campo-item mb-2">
        <label class="form-label small mb-1" for="campo_{{ campo.id }}">{{ campo.nome_campo }}</label>
        <textarea name="campo_{{ campo.id }}" id="campo_{{ campo.id }}" class="form-control" rows="2" autocomplete="off">{{ campo.valor or '' }}</textarea>
    </div>
    {% endfor %}
</div>
